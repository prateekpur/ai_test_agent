[project]
name = "ai-test-agent"
version = "0.1.0"
description = "AI-driven test automation system for API, Web, and Mobile tests"
requires-python = ">=3.8"

[tool.ruff]
line-length = 100
target-version = "py38"

exclude = [
    ".git",
    ".pytest_cache",
    "__pycache__",
    "*.pyc",
    ".venv",
    "venv",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "PIE",    # flake8-pie
    "RET",    # flake8-return
    "RSE",    # flake8-raise
    "PTH",    # flake8-use-pathlib
]

ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "N802",   # function name should be lowercase (allows CamelCase for fixtures)
    "N803",   # argument name should be lowercase (allows CamelCase for fixtures)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"examples/*.py" = ["T201", "E402"]
"tests/*.py" = ["N802", "N803"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["src", "test_generator", "runners"]
